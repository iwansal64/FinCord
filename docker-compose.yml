services:
        frontend:
                build:
                        context: ./frontend
                        dockerfile: Dockerfile
                ports:
                        - "3000:3000"
                volumes:
                        - ./frontend:/app
                        - /app/node_modules
                        - /app/.next
                env_file:
                        - ./frontend/.env
                depends_on:
                        - backend_api

        backend_api:
                build:
                        context: ./backend/api
                        dockerfile: Dockerfile
                ports:
                        - "8080:8080"
                volumes:
                        - ./backend/api:/app
                        - backend-target:/app/target
                env_file:
                        - ./backend/api/.env
                depends_on:
                        postgres:
                                condition: service_healthy

        backend_ai:
                build:
                        context: ./backend/ai
                        dockerfile: Dockerfile
                ports:
                        - "8081:8081"
                env_file:
                        - ./backend/ai/.env

        postgres:
                image: postgres:16-alpine
                env_file:
                        - ./.env
                ports:
                        - "5432:5432"
                volumes:
                        - pgdata:/var/lib/postgresql/data
                healthcheck:
                        test: ["CMD-SHELL", "pg_isready -U postgres"]
                        interval: 5s
                        timeout: 5s
                        retries: 5

        qdrant:
                image: qdrant/qdrant:latest
                ports:
                        - "6333:6333"
                        - "6334:6334"
                volumes:
                        - qdrant_storage:/qdrant/storage
                healthcheck:
                        test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
                        interval: 30s
                        timeout: 10s
                        retries: 5

volumes:
        pgdata:
        backend-target:
        qdrant_storage:
