services:
        frontend:
                build:
                        context: ./frontend
                        dockerfile: Dockerfile
                ports:
                        - "3000:3000"
                volumes:
                        - ./frontend:/app
                        - /app/node_modules
                        - /app/.next
                env_file:
                        - ./frontend/.env
                depends_on:
                        - backend

        backend_api:
                build:
                        context: ./backend/api
                        dockerfile: Dockerfile
                ports:
                        - "8080:8080"
                volumes:
                        - ./backend/api:/app
                        - backend-target:/app/target
                env_file:
                        - ./backend/api/.env
                depends_on:
                        postgres:
                                condition: service_healthy

        postgres:
                image: postgres:16-alpine
                env_file:
                        - ./.env
                ports:
                        - "5432:5432"
                volumes:
                        - pgdata:/var/lib/postgresql/data
                healthcheck:
                        test: ["CMD-SHELL", "pg_isready -U postgres"]
                        interval: 5s
                        timeout: 5s
                        retries: 5

volumes:
        pgdata:
        backend-target:
