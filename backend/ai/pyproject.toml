[project]
name = "fincord_chatbot_api"
version = "0.1.0"
description = "API endpoints for interfacing backend to LLM models"
readme = "README.md"
authors = [
    { name = "Iwansal64", email = "iwansal64@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx[http2]>=0.28.1",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.6",
    "langchain-google-genai>=4.3.4",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.2.11",
    "qdrant-client>=1.19.0",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
fincord_chatbot_api = "fincord_chatbot_api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
