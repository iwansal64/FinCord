[package]
name = "fincord-backend"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "migration", "entity"]

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sea-orm = { version = "2.0.1", features = [ "macros" ] }
chrono = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "chrono"] }

[dependencies]
actix-web = "4"
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
lettre = { version = "0.11.23", features = ["tokio1", "tokio1-native-tls", "smtp-transport", "builder"] }
chrono = { workspace = true }
rand = "0.10.2"
hickory-resolver = "0.26.1"
sea-orm = { workspace = true, features = ["sqlx-postgres", "runtime-tokio-native-tls"] }
validator = { version = "0.21.0", features = ["derive"] }
migration = { path = "migration" }
entity = { path = "entity" }
trust-dns-resolver = "0.23.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
either = "1.17.0"
password-hash = "0.6.1"
